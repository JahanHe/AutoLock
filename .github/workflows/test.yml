name: 中文测试版构建检查

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: 编译与检查
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: 检查汉化资源
        run: python3 scripts/check_localization.py
      - name: 检查锁定与手表兼容行为
        run: scripts/check_behavior.sh
      - name: 编译应用
        run: >-
          xcodebuild -project AutoLock.xcodeproj -scheme AutoLock
          -configuration Release -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build
      - name: 检查打包结果
        run: python3 scripts/check_localization.py build/Build/Products/Release/AutoLock.app
      - name: 记录可追溯源码版本
        run: /usr/libexec/PlistBuddy -c "Add :AutoLockSourceRevision string $GITHUB_SHA" build/Build/Products/Release/AutoLock.app/Contents/Info.plist
      - name: 为测试包添加本地签名
        run: |
          codesign --force --sign - build/Build/Products/Release/AutoLock.app/Contents/Library/LoginItems/AutoLockLauncher.app
          codesign --force --sign - build/Build/Products/Release/AutoLock.app
          codesign --verify --deep --strict build/Build/Products/Release/AutoLock.app
      - name: 压缩中文测试版
        run: ditto -c -k --keepParent build/Build/Products/Release/AutoLock.app AutoLock-1.13.5.zip
      - uses: actions/upload-artifact@v7
        with:
          name: AutoLock-1.13.5-中文测试版
          path: AutoLock-1.13.5.zip
